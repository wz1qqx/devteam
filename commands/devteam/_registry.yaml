# devteam Command Registry
# Source of truth for Claude/Codex command definitions.
# Run `node bin/generate-commands.cjs` to regenerate .md files.
#
# This registry exposes the .devteam workspace workflow and independent
# reusable skills.

_skip: []

commands:
  workspace:
    description: Workspace management — scaffold .devteam layout and agent onboarding/context
    argument-hint: "<scaffold|onboard|context> [--root <path>] [--set <track>] [--feat <feat>] [--name <name>] [--write] [--force] [--for codex|claude|human] [--text]"
    objective: Create a devteam workspace layout and generate/read the agent onboarding protocol for any .devteam workspace.
    allowed-tools: [Read, Write, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" workspace $ARGUMENTS`. For scaffold, display created/skipped files and next_action; use --force only when intentionally replacing an existing workspace config. For onboard, render AGENTS.md, CLAUDE.md, and README.devteam.md from the workspace config, registry, and lane files; dry-run by default, write only with --write, and overwrite drifted files only with --force. For context, print the dynamic agent context: workspace identity, track/feature selection policy, active/parked/archived tracks with configured features, selected/default track and feature, primary next action, and first commands. `--feat` narrows runtime context and generated commands to one feature while preserving the track-owned profiles and capability instances. This command does not choose concrete repos, branches, remote venvs, image tags, or cluster targets."

  doctor:
    description: Workspace doctor — checks local worktrees, env/sync readiness, and agent onboarding
    argument-hint: "[agent-onboarding] [--root <path>] [--set <track>] [--feat <feat>] [--profile <env-profile>] [--text]"
    objective: Run the local-to-remote workspace doctor or check that Claude/Codex onboarding is ready for a .devteam workspace.
    allowed-tools: [Read, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" doctor $ARGUMENTS`. Without subcommands, display status, problems, workspace totals, env status, sync totals, run-history health, and next_action. If history has invalid run metadata, review `session archive-plan` before cleaning it up with `session archive --yes`. With `doctor agent-onboarding`, check AGENTS.md, CLAUDE.md, dynamic workspace context, track picker readiness, and devteam-console/devteam-status skill availability; use `workspace onboard --write` to create missing onboarding files."

  track:
    description: Track management — list, inspect, bind, or set default workspace tracks
    argument-hint: "<list|status|context|bind|use> [track] [--root <path>] [--set <track>] [--feat <feat>] [--text] [--no-runtime] [--active-only] [--dry-run]"
    objective: Inspect tracks, print selected-track agent context, bind one track to the current terminal/session, or update the workspace default track hint.
    allowed-tools: [Read, Write, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" track $ARGUMENTS`. Track selection order is --set, DEVTEAM_TRACK, then .devteam/config.yaml defaults.track; feature selection order is --feat, DEVTEAM_FEAT/DEVTEAM_FEATURE, then defaults.feat or the track default_feat. Track and feature names accept canonical names plus configured aliases, normalized for spaces, underscores, and hyphens; if an alias is ambiguous, ask the user to choose the canonical name. Tracks own reusable env, sync, build, deploy flow, validation, remote venv, K8s dev, and capability instance bindings. Features are nested under a track and select only incremental feature worktrees. For list, display each track with aliases, lifecycle status, inferred profiles/instances, repo count, selected marker, workspace dirty/missing totals, latest run phase, and presence hints; pass --text for the compact track dashboard and --no-runtime to skip workspace/run/presence inspection. Tracks may declare status: active, parked, or archived. With --active-only, show active tracks plus selected/default, dirty/missing, presence, or unfinished-run tracks; omit it to inspect all tracks. For status/context, pass --feat when working on one feature; runtime worktrees and latest runs are scoped to that feature while profiles and instances stay inherited from the track. For bind <track>, print an export DEVTEAM_TRACK command for this terminal/session without modifying config. For use <track>, update only the defaults block in .devteam/config.yaml; use --dry-run to preview and avoid it when multiple sessions may be active. This command does not touch worktrees, remote servers, images, or clusters."

  repo:
    description: Repo management — inspect upstream, branch, dirty, and fetch state
    argument-hint: "<list|status|fetch|update-plan> [--root <path>] [--set <track>] [--feat <feat>] [--text]"
    objective: Inspect configured development repos and worktrees, track upstream drift, fetch remotes explicitly, and plan clean local updates without managing evidence.
    allowed-tools: [Read, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" repo $ARGUMENTS`. Use `repo status --text` as the daily upstream/update view: it reports configured repo remote/upstream URLs, selected worktrees, local branch/head, dirty file counts, base/upstream ref, ahead/behind counts, missing worktrees, and unknown upstream refs. Use `repo list` for configured repo/worktree inventory only. `repo fetch` is the only mutating subcommand; it runs `git fetch --prune` against configured local remotes for selected existing git worktrees. Use it only when the user asks to refresh remote state or when upstream freshness is required. `repo update-plan` prints fetch/rebase commands for clean worktrees that are behind their configured base/upstream ref; it does not execute the update. Track/feature selection follows --set/--feat, DEVTEAM_TRACK/DEVTEAM_FEAT, then workspace defaults."

  presence:
    description: Session presence — soft-lock hints for concurrent track work
    argument-hint: "<list|touch|clear> [--root <path>] [--set <track>] [--feat <feat>] [--session-id <id>] [--purpose <text>] [--run <id>] [--ttl-seconds <n>] [--text] [--yes]"
    objective: Record and inspect lightweight active-session presence under .devteam/presence without blocking work.
    allowed-tools: [Read, Write, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" presence $ARGUMENTS`. touch writes/refreshes .devteam/presence/<session-id>.json for the selected track and optional feature with optional run and purpose. list shows active entries grouped by track or track/feature; pass --all to include expired entries and --ttl-seconds to override the default 45 minute TTL. clear is dry-run by default and removes selected or expired entries only with --yes. Presence is a soft-lock hint only; it never blocks sync, record, build, publish, or deploy."

  session:
    description: Run session — start, snapshot, status, or record workspace validation runs
    argument-hint: "<start|snapshot|status|handoff|record|list|lint|archive-plan|archive|supersede-plan|supersede-stale|close|supersede|reopen> [--root <path>] [--set <track>] [--feat <feat>] [--run <id>] [--limit <n>] [--text] [--all] [--yes] [--kind <kind>] [--status <status>] [--summary <text>] [--pytest-log <path>] [--remote-pytest-log <path>]"
    objective: Create, inspect, and update an auditable .devteam/runs/<id>/ directory for the local-to-remote validation loop.
    allowed-tools: [Read, Write, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" session start $ARGUMENTS` unless the user explicitly asks for snapshot, status, handoff, record, list, lint, archive-plan, archive, supersede-plan, supersede-stale, close, supersede, or reopen. For start, display run_id, path, readme_path, track, optional feat, inherited profiles, and readiness status. Use --no-build --no-deploy for source/venv validation sessions before a concrete image or pre-production target has been chosen. For status, display phase, latest evidence, workspace totals, sync/image/deploy/deploy-verify/publish gates, publish-after-validation plan, and next_actions; if --run is omitted it reads the latest open readable run, skips historical runs that no longer match current config, and honors --set plus optional --feat to pick the latest run for one track/feature. For handoff, print an agent-focused continuation packet with workspace, track, feat, run, lifecycle, stale-head status, profiles, worktrees, verified evidence, do-not rules, and next actions. session list/lint are read-only and support --set, --feat, --limit, --all, and --text; with --feat they scope history to that feature under the selected track. session supersede-plan previews stale old runs that have newer open runs on the same track/feature, while blocking that scope's latest stale run; session supersede-stale is dry-run by default and marks only supersedeable stale runs when --yes is passed. session close/supersede/reopen update session.json lifecycle metadata without moving evidence. session archive-plan is read-only and lists only invalid metadata runs that can be moved to .devteam/runs-archive/. session archive is dry-run by default and moves those invalid run directories only with --yes. For record, append completed step evidence to events.jsonl and README.md with --run, --kind, --status, --summary, and optional --command/--log/--artifact; it refuses closed/superseded runs unless --allow-closed is passed and refuses cross-track/feature evidence unless --allow-cross-track is explicit."

  status:
    description: Harness status — one-screen workspace/repo/env overview
    argument-hint: "[--root <path>] [--set <track>] [--feat <feat>] [--json] [--session|--run <id>]"
    objective: Display the workspace harness state: selected track/feature, local worktrees, repo/upstream drift, environment/runtime binding, sync state, presence, and recent runs.
    allowed-tools: [Read, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" status $ARGUMENTS`. This is the harness daily status, not a required evidence gate: it summarizes selected track/feature, worktree present/dirty/missing counts, repo upstream behind/unknown counts, effective environment/profile/runtime exports, proxy availability, last sync state, active presence, and latest run summary when one exists. By default it prints compact text; pass --json for the structured payload. Use `status --session`, `status --run <id>`, or `session status` only when the user explicitly wants the older run/evidence/gate view."

  ws:
    description: Workspace inventory — local repo/worktree status
    argument-hint: "<status|materialize|publish-plan|publish> [--root <path>] [--set <track>] [--feat <feat>] [--text] [--full] [--limit <n>] [--apply] [--run <id>] [--yes]"
    objective: Inspect local worktrees from the workspace config and lane files.
    allowed-tools: [Read, Write, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" ws $ARGUMENTS`. Without --feat, status/materialize/publish operate on the track worktrees. With --feat, they operate only on that feature's incremental worktrees while reusing the track-owned profiles and instances. For status, display one row per worktree: id, repo, path, branch, dirty, dirty_file_count, dirty_summary, dirty_files, commits_ahead, exists, source_exists; pass --text for the compact terminal view, --full for the full captured dirty file list, or --limit <n> to cap dirty file lines. For materialize, display planned clone commands; only use --apply when the user explicitly asks to create local clones. For publish-plan, display publish.after_validation worktrees, branch/dirty/remote-ref state, run_gate when --run is passed, blocked_by reasons, and generated git push commands. For publish, dry-run by default, require a ready run gate by default, execute only with --yes, and record publish evidence to the run."

  env:
    description: Environment registry — list profiles/environments, inspect machine facts, doctor, or refresh remote/k8s profiles
    argument-hint: "<list|show|environments|doctor|runtime|refresh> [--root <path>] [--set <track>] [--feat <feat>] [--env <environment>] [--profile <name>] [--remote] [--yes] [--run <id>] [--text]"
    objective: Inspect machine/cluster environments plus lightweight remote_dev and k8s environment profiles, and refresh vLLM editable remote venvs when explicitly requested.
    allowed-tools: [Read, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" env $ARGUMENTS`. list prints lane-local env_profiles plus the shared machine/cluster environments registry. show/environments inspect fixed machine or cluster facts, compatible capabilities, and status without remote side effects. runtime prints the effective track/feature env exports, including inherited environment proxy, work_dir/source_dir/venv, K8s namespace/kubeconfig, and selected worktree remote paths; source a run's `.devteam/runs/<id>/runtime.sh` before remote or K8s helper commands. For doctor, display local command checks and missing profile fields for env_profiles. --remote performs explicit read-only SSH checks. With doctor --remote --run <id>, append an env-doctor event to that run. For refresh, show the generated command unless --yes is present; only execute remote editable venv refresh with explicit --yes. With refresh --yes --run <id>, append an env-refresh event to that run."

  capability:
    description: Capability registry — list or inspect validation/build/deploy capability definitions
    argument-hint: "<list|show> [--root <path>] [--method <capability>]"
    objective: Inspect CRD-like capability standards such as remote-vllm-venv, k8s-vllm-dev, image build modes, and k8s deploy.
    allowed-tools: [Read, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" capability $ARGUMENTS`. list shows capability definitions, maturity, compatible environment kind, evidence gates, and production_gate. show displays the full capability definition plus compatible environments and validation/deploy instances. This command is read-only and does not bootstrap, sync, build, deploy, or mutate remote state."

  validate:
    description: Validation registry — list or plan validation capability instances
    argument-hint: "<list|plan> [--root <path>] [--set <track>] [--feat <feat>] [--method <capability>] [--env <environment>] [--instance <name>] [--text]"
    objective: Choose and inspect CR-like validation instances that bind track/feature, capability definition, and environment.
    allowed-tools: [Read, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" validate $ARGUMENTS`. list shows validation_instances for the selected track/feature and optional method/environment filters. plan resolves one validation instance, checks required environment/instance facts, reports evidence gates and production_gate, prints the shared runtime env context, and prints explicit execution bridge commands such as env doctor, sync plan, or K8s helper usage prefixed with the runtime source command when needed. This command is read-only; bootstrap/sync/test/snapshot require explicit follow-up commands."

  sync:
    description: Sync planning — local worktrees to remote development environment
    argument-hint: "<plan|apply|status> [--root <path>] [--set <track>] [--feat <feat>] [--profile <env-profile>] [--patch-mode <branch-patch|dirty-only>] [--dirty-only] [--branch-patch] [--include-assets] [--yes] [--run <id>]"
    objective: Generate an explicit rsync plan for local-to-remote development testing.
    allowed-tools: [Read, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" sync plan $ARGUMENTS` unless another subcommand is provided. The sync/env profile is inferred from the selected track; --feat only narrows the worktree set to that feature. Display syncable/missing totals, patch mode, patch file counts, and generated commands. For relative patch sync strategies, branch-patch syncs base_ref..HEAD plus dirty/staged/untracked files and remains the default for sync plan/apply; dirty-only syncs only current working tree, staged, and untracked files for daily incremental validation. `sync apply` is dry-run by default; only pass --yes when the user explicitly asks to execute rsync. With apply --yes --run <id>, append a sync event to that run."

  remote-loop:
    description: Remote validation loop — start, sync, doctor, refresh, record tests, and status for the active track
    argument-hint: "<plan|start|doctor|refresh|sync|record-test|status> [--root <path>] [--set <track>] [--feat <feat>] [--run <id>] [--yes] [--branch-patch] [--remote-pytest-log <path>] [--text]"
    objective: Run the active track's lightweight local-to-remote source/venv validation loop without choosing image or deployment recipes.
    allowed-tools: [Read, Write, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" remote-loop $ARGUMENTS`. plan prints the concrete command sequence for the selected track and optional feature; pass --text for the compact terminal view. The remote venv/env/sync profiles come from the track, while --feat scopes local worktrees and run history to one feature. If the latest open run for that track/feature is stale because worktree HEAD changed, keep start/status visible but use <fresh-run-id> for evidence-writing commands. start creates a no-build/no-deploy run; pass --text to print the new run id plus concrete doctor/sync/record-test follow-up commands. doctor runs env doctor --remote and records env-doctor evidence. refresh only executes with --yes and records env-refresh evidence. sync shows dirty-only sync by default, only applies with --yes, records sync evidence, and accepts --branch-patch when rebuilding the remote mirror from the full branch patch. record-test records local or remote pytest logs with --pytest-log or --remote-pytest-log. status shows compact status for the latest open selected track/feature run; closed and superseded runs are ignored by default. If --run is omitted and the latest open run is stale, mutating/recording subcommands refuse before remote side effects; start a fresh run first and pass its --run id."

  image:
    description: Image planning and evidence recording for a track or feature
    argument-hint: "<plan|prepare|record> [--root <path>] [--set <track>] [--feat <feat>] [--profile <build-profile>] [--run <id>] [--output <path>] [--image <ref>] [--digest <digest>]"
    objective: Show the build contract, target image, source heads, gates, and patch safety before an image build; prepare dry-run build contexts; record completed image build evidence.
    allowed-tools: [Read, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" image plan $ARGUMENTS` unless the user explicitly asks for prepare or record. Build profile selection comes from the track; --feat narrows source_heads and patch inputs to one feature worktree. Display mode, builder, target image, source_heads, recipe, strategy, gates, missing fields, unsafe_patch_files, notes, and next_action. Treat command as optional because new build profiles are contracts first. `image prepare` may materialize a local .devteam/image-contexts context but must not run Docker or push images. Do not execute remote builds unless the user explicitly asks. Use image record after a build completes to update events.jsonl and README.md."

  deploy:
    description: Deploy planning and evidence recording for k8s pre-production validation
    argument-hint: "<list|plan|record|verify-record> [--root <path>] [--set <track>] [--feat <feat>] [--method <capability>] [--env <environment>] [--instance <name>] [--profile <deploy-profile>] [--run <id>] [--namespace <namespace>] [--image <ref>]"
    objective: List or plan CR-like k8s deployment instances for pre-production validation, then record deployment and post-deploy verification evidence separately.
    allowed-tools: [Read, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" deploy $ARGUMENTS`, defaulting to `deploy plan` when no subcommand is given. `deploy list` shows deploy_instances for the selected track/feature and optional method/environment/profile filters. `deploy plan` resolves one deployment instance when configured, checks required capability facts, surfaces the associated deploy profile/flow commands plus run_gate and verify_gate, and prefixes flow commands with the shared runtime source command so proxy/K8s env exports are not lost. Do not mutate the cluster unless the user explicitly asks. Use deploy record after deploying the image, then deploy verify-record after health checks, smoke traffic, or benchmark validation pass."

  skill:
    description: Skill management — discover, lint, and install devteam Codex skills
    argument-hint: "<list|status|lint|install> [name] [--root <path>] [--target <path>] [--all] [--yes] [--text]"
    objective: Manage repo/workspace Codex skill folders separately from knowledge docs.
    allowed-tools: [Read, Write, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" skill $ARGUMENTS`. list/status shows repo skills plus workspace .devteam/skills folders, their install target, and whether installed copies are missing/current/drift/invalid. lint validates SKILL.md frontmatter, folder/name alignment, and duplicate sources. install is dry-run by default; only use --yes when the user explicitly asks to copy skill folders into the target skills directory. Default target is ~/.agents/skills; use --target to override."

  knowledge:
    description: Knowledge operations — list/search/lint/capture recipes, wiki, and skills
    argument-hint: "<list|search|lint|capture> [query] [--root <path>] [--type <wiki|recipes|skills|all>] [--run <id>] [--apply]"
    objective: Manage the lightweight .devteam knowledge layer: recipes, wiki notes, reusable skills, and run-to-knowledge capture drafts.
    allowed-tools: [Read, Write, Bash, Glob, Grep]
    inline-process: "Run `node \"$DEVTEAM_BIN\" knowledge $ARGUMENTS`. list and search are read-only and cover .devteam/wiki, .devteam/recipes, and .devteam/skills. lint checks missing knowledge dirs, overlong markdown, wiki index coverage, and dead wikilinks. capture reads a run and creates a draft by default; only write it with --apply, and use --to wiki or --to recipes to choose the target."

  vllm-opt:
    description: vLLM optimization — benchmark, profile, and diagnose inference regressions
    argument-hint: "[--root <path>] [--set <track>] [benchmark/profile context]"
    objective: Use the independent vllm-opt skill to analyze TTFT/TPOT/throughput regressions with benchmark evidence, profiler traces, and kernel/category breakdowns.
    skill: vllm-opt/SKILL.md
    allowed-tools: [Read, Bash, Glob, Grep]
